<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onegpu-llm</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@15/lib/marked.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #0f1115; color: #e6e8eb; min-height: 100vh; }
  header { padding: 20px 32px; border-bottom: 1px solid #23272f; display: flex;
           align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 18px; font-weight: 600; }
  .gpu-bar { display: flex; gap: 20px; font-size: 13px; color: #9aa0aa; }
  .gpu-bar b { color: #e6e8eb; font-weight: 600; }
  .mem-track { width: 160px; height: 6px; background: #23272f; border-radius: 3px;
               display: inline-block; vertical-align: middle; margin-left: 6px; overflow: hidden; }
  .mem-fill { height: 100%; background: #4f8cff; border-radius: 3px; transition: width .5s; }
  main { padding: 24px 32px; max-width: 1200px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card { background: #171a21; border: 1px solid #23272f; border-radius: 10px; padding: 18px; }
  .card.running { border-color: #2ea043; }
  .card h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card .model-id { font-size: 12px; color: #9aa0aa; margin: 6px 0 12px; word-break: break-all; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
  .badge.green { background: rgba(46,160,67,.15); color: #3fb950; }
  .badge.gray { background: #23272f; color: #9aa0aa; }
  .badge.yellow { background: rgba(210,153,34,.15); color: #d29922; }
  .actions { display: flex; gap: 8px; }
  button { font-size: 13px; padding: 6px 14px; border-radius: 6px; border: 1px solid #30363d;
           background: #21262d; color: #e6e8eb; cursor: pointer; }
  button:hover { background: #2d333b; }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.primary:hover { background: #388bfd; }
  button.danger { color: #f85149; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #log-panel { margin-top: 24px; background: #0a0c10; border: 1px solid #23272f;
               border-radius: 10px; display: none; }
  #log-panel.open { display: block; }
  #log-header { padding: 10px 16px; border-bottom: 1px solid #23272f; font-size: 13px;
                display: flex; justify-content: space-between; align-items: center; }
  #log-content { padding: 12px 16px; font-family: "JetBrains Mono", Consolas, monospace;
                 font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all;
                 max-height: 400px; overflow-y: auto; color: #b8bec7; }
  .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 18px; border-radius: 8px;
           font-size: 13px; display: none; z-index: 10; }
  .toast.error { background: #3d1d1f; border: 1px solid #f85149; display: block; }
  .toast.info { background: #1c2b4a; border: 1px solid #388bfd; display: block; }
  #chat-panel { position: fixed; top: 0; right: -820px; width: 480px; height: 100vh;
                background: #0f1115; border-left: 1px solid #23272f; display: flex;
                flex-direction: column; transition: right .25s; z-index: 20; }
  #chat-panel.open { right: 0; }
  #chat-header { padding: 14px 16px; border-bottom: 1px solid #23272f; font-size: 14px;
                 display: flex; justify-content: space-between; align-items: center; }
  #chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex;
                   flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 13px;
         line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #1f6feb; }
  .msg.bot { align-self: flex-start; background: #21262d; }
  .msg.bot details { margin-top: 6px; font-size: 12px; color: #9aa0aa; }
  .msg.bot summary { cursor: pointer; }
  .msg.bot details div { margin-top: 4px; padding-left: 8px; border-left: 2px solid #30363d; }
  .search-item { margin: 6px 0; font-size: 12px; }
  .search-item a { color: #a5d6ff; text-decoration: none; }
  .search-item a:hover { text-decoration: underline; }
  .search-item .snippet { color: #9aa0aa; margin-top: 2px; }
  .metrics { margin-top: 8px; font-size: 11px; color: #6e7681; }
  #chat-resize { position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
                 cursor: ew-resize; z-index: 21; }
  #chat-resize:hover { background: rgba(88,166,255,.3); }
  #chat-header select { background: #0a0c10; border: 1px solid #30363d; border-radius: 6px;
                        color: #e6e8eb; font-size: 12px; padding: 4px 8px; max-width: 180px; }
  details.live > summary { color: #8b949e; }
  .msg img.att { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }
  .msg .md { white-space: normal; line-height: 1.75; }
  .msg .md > *:first-child { margin-top: 0; }
  .msg .md > *:last-child { margin-bottom: 0; }
  .msg .md p { margin: 8px 0; }
  .msg .md ul, .msg .md ol { margin: 8px 0; padding-left: 22px; }
  .msg .md li { margin: 4px 0; }
  .msg .md h1, .msg .md h2, .msg .md h3, .msg .md h4 { margin: 14px 0 8px; line-height: 1.4; }
  .msg .md h1 { font-size: 17px; } .msg .md h2 { font-size: 16px; }
  .msg .md h3 { font-size: 15px; } .msg .md h4 { font-size: 14px; }
  .msg .md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid #30363d;
                        color: #9aa0aa; }
  .msg .md hr { border: none; border-top: 1px solid #30363d; margin: 12px 0; }
  .msg .md a { color: #a5d6ff; }
  .msg pre { background: #0a0c10; border: 1px solid #23272f; border-radius: 8px;
             padding: 10px 12px; overflow-x: auto; margin: 0; white-space: pre; }
  .code-wrap { position: relative; margin: 8px 0; }
  .copy-btn { background: none; border: none; padding: 2px; cursor: pointer; opacity: .45;
              color: #9aa0aa; display: inline-flex; align-items: center; gap: 4px;
              font-size: 11px; border-radius: 4px; }
  .copy-btn:hover { opacity: 1; background: #21262d; }
  .copy-btn.copied { color: #3fb950; opacity: 1; }
  .code-wrap > .copy-btn { position: absolute; top: 6px; right: 6px; background: #171a21;
                           border: 1px solid #30363d; }
  .msg-actions { display: flex; gap: 8px; margin-top: 8px; }
  .msg code { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; }
  .msg p > code, .msg li > code { background: #0a0c10; padding: 1px 5px; border-radius: 4px; }
  .msg table { border-collapse: collapse; margin: 8px 0; font-size: 12px; }
  .msg th, .msg td { border: 1px solid #30363d; padding: 4px 10px; }
  #chat-toolbar { padding: 8px 12px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #chat-toolbar select { background: #0a0c10; border: 1px solid #30363d; border-radius: 6px;
                         color: #e6e8eb; font-size: 12px; padding: 4px 8px; }
  .toggle { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #9aa0aa;
            cursor: pointer; user-select: none; }
  #attach-row { padding: 4px 12px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; background: #21262d; border: 1px solid #30363d; border-radius: 10px;
          padding: 2px 8px; display: flex; align-items: center; gap: 6px; }
  .chip span.x { cursor: pointer; color: #f85149; }
  #chat-input-row { padding: 12px; border-top: 1px solid #23272f; display: flex; gap: 8px; }
  #chat-input { flex: 1; background: #0a0c10; border: 1px solid #30363d; border-radius: 8px;
                color: #e6e8eb; padding: 8px 12px; font-size: 13px; font-family: inherit;
                resize: none; height: 40px; }
  #chat-input:focus { outline: none; border-color: #1f6feb; }
</style>
</head>
<body>
<header>
  <h1><img src="/static/logo.svg" alt="logo" style="width:28px;height:28px;vertical-align:-6px;margin-right:8px;">onegpu-llm</h1>
  <div class="gpu-bar">
    <button id="chat-toggle" onclick="toggleChat()">对话</button>
    <span id="gpu-name">GPU: --</span>
    <span>利用率 <b id="gpu-util">--</b>%</span>
    <span>显存 <b id="gpu-mem">--</b><span class="mem-track"><span class="mem-fill" id="gpu-mem-fill"></span></span></span>
    <span>温度 <b id="gpu-temp">--</b>°C</span>
    <span>功耗 <b id="gpu-power">--</b>W</span>
  </div>
</header>
<main>
  <div class="grid" id="models"></div>
  <div id="log-panel">
    <div id="log-header">
      <span id="log-title">日志</span>
      <button onclick="closeLogs()">关闭</button>
    </div>
    <div id="log-content"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<div id="chat-panel">
  <div id="chat-resize"></div>
  <div id="chat-header">
    <select id="chat-list" onchange="loadChat(this.value)"><option value="">当前对话</option></select>
    <button onclick="newChat()">新建对话</button>
    <button onclick="toggleChat()">关闭</button>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-toolbar">
    <select id="chat-model"></select>
    <label class="toggle"><input type="checkbox" id="web-search"> 联网搜索</label>
    <button onclick="document.getElementById('file-input').click()" title="添加图片或文本文件">附件</button>
    <input type="file" id="file-input" hidden multiple
      accept="image/*,.txt,.md,.markdown,.json,.csv,.py,.js,.ts,.html,.css,.yaml,.yml,.xml,.log"
      onchange="handleFiles(this)">
  </div>
  <div id="attach-row"></div>
  <div id="chat-input-row">
    <textarea id="chat-input" placeholder="输入消息，Enter 发送（Shift+Enter 换行）"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
    <button class="primary" onclick="sendChat()">发送</button>
  </div>
</div>

<script>
let chatHistory = [];
let attachments = [];
let currentChatId = null;

function toggleChat() {
  document.getElementById('chat-panel').classList.toggle('open');
}

// ---- 面板宽度拖拽 ----
(function() {
  const panel = document.getElementById('chat-panel');
  const handle = document.getElementById('chat-resize');
  const saved = localStorage.getItem('chatWidth');
  if (saved) panel.style.width = saved + 'px';
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    const move = ev => {
      const w = Math.min(900, Math.max(340, window.innerWidth - ev.clientX));
      panel.style.width = w + 'px';
    };
    const up = () => {
      localStorage.setItem('chatWidth', parseInt(panel.style.width));
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
})();

if (window.marked) marked.setOptions({ breaks: true, gfm: true });

const COPY_SVG = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M5 2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H5zm0 1.5h6a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-.5.5H5a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M7.5 5.5a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1h-3zm0 2.5a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1h-3z"/></svg>';
const CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0z"/></svg>';

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  btn.innerHTML = CHECK_SVG;
  btn.classList.add('copied');
  setTimeout(() => { btn.innerHTML = COPY_SVG; btn.classList.remove('copied'); }, 1500);
}

function makeCopyBtn(getText) {
  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.innerHTML = COPY_SVG;
  btn.title = '拷贝';
  btn.onclick = e => { e.stopPropagation(); copyText(getText(), btn); };
  return btn;
}

function addCodeCopyButtons(mdDiv) {
  mdDiv.querySelectorAll('pre').forEach(pre => {
    if (pre.parentElement.classList.contains('code-wrap')) return;
    const wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    wrap.appendChild(makeCopyBtn(() => pre.textContent));
  });
}

function addMsgCopyAction(msgDiv, rawText) {
  if (msgDiv.querySelector('.msg-actions')) return;
  const bar = document.createElement('div');
  bar.className = 'msg-actions';
  bar.appendChild(makeCopyBtn(() => rawText));
  msgDiv.appendChild(bar);
}

function renderMd(text, highlight = true) {
  const div = document.createElement('div');
  div.className = 'md';
  if (window.marked && window.DOMPurify) {
    div.innerHTML = DOMPurify.sanitize(marked.parse(text));
    if (highlight && window.hljs) {
      div.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    }
    if (highlight) addCodeCopyButtons(div);
    return div;
  }
  div.textContent = text;
  return div;
}

function makeDetails(cls, summaryText, open = false) {
  const d = document.createElement('details');
  d.className = 'live ' + cls;
  d.open = open;
  const s = document.createElement('summary');
  s.textContent = summaryText;
  d.appendChild(s);
  return d;
}

function fillSearchBlock(det, results) {
  det.querySelectorAll('.search-item').forEach(n => n.remove());
  det.querySelector('summary').textContent = `搜索到 ${results.length} 条结果`;
  results.forEach((r, i) => {
    const item = document.createElement('div');
    item.className = 'search-item';
    const link = document.createElement('a');
    link.href = r.href; link.target = '_blank'; link.rel = 'noopener';
    link.textContent = `[${i+1}] ${r.title || r.href}`;
    const snippet = document.createElement('div');
    snippet.className = 'snippet';
    snippet.textContent = (r.body || '').slice(0, 150);
    item.appendChild(link); item.appendChild(snippet);
    det.appendChild(item);
  });
}

function metricsText(m) {
  if (!m) return '';
  const parts = [];
  if (m.ttft != null) parts.push(`首 token ${m.ttft}s`);
  if (m.tps) parts.push(`${m.tps} tok/s`);
  if (m.tokens) parts.push(`${m.tokens} tokens`);
  if (m.total) parts.push(`共 ${m.total}s`);
  return parts.join(' · ');
}

function appendUserMsg(text, images = []) {
  const el = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  images.forEach(src => {
    const img = document.createElement('img');
    img.src = src; img.className = 'att';
    div.appendChild(img);
  });
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function appendBotMsg(content, reasoning, searchResults = [], metrics = null) {
  const el = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  if (searchResults.length > 0) {
    const d = makeDetails('search', '', false);
    fillSearchBlock(d, searchResults);
    div.appendChild(d);
  }
  if (reasoning) {
    const d = makeDetails('thinking', '思考过程', false);
    const body = document.createElement('div');
    body.textContent = reasoning;
    d.appendChild(body);
    div.appendChild(d);
  }
  div.appendChild(renderMd(content));
  addMsgCopyAction(div, content);
  if (metrics) {
    const m = document.createElement('div');
    m.className = 'metrics';
    m.textContent = metricsText(metrics);
    div.appendChild(m);
  }
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  return div;
}

function refreshChatModels() {
  const sel = document.getElementById('chat-model');
  const cur = sel.value;
  const downloaded = models.filter(m => m.downloaded);
  const running = models.find(m => m.api_ready);
  sel.innerHTML = downloaded.map(m => {
    const label = m.served_name + (m.api_ready ? ' (运行中)' : m.running ? ' (启动中)' : ' (未运行)');
    const selected = (running && m.key === running.key) || (!running && m.served_name === cur);
    return `<option value="${m.served_name}" ${selected ? 'selected' : ''}>${label}</option>`;
  }).join('') || '<option value="">(无已下载模型)</option>';
}

function handleFiles(input) {
  [...input.files].forEach(f => {
    if (f.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = () => { attachments.push({ kind: 'image', name: f.name, data: reader.result }); renderChips(); };
      reader.readAsDataURL(f);
    } else {
      const reader = new FileReader();
      reader.onload = () => { attachments.push({ kind: 'text', name: f.name, data: reader.result }); renderChips(); };
      reader.readAsText(f);
    }
  });
  input.value = '';
}

function renderChips() {
  document.getElementById('attach-row').innerHTML = attachments.map((a, i) =>
    `<span class="chip">${a.kind === 'image' ? '🖼' : '📄'} ${a.name}<span class="x" onclick="attachments.splice(${i},1);renderChips()">✕</span></span>`
  ).join('');
}

function buildUserContent(text) {
  let fullText = text;
  const images = [];
  attachments.forEach(a => {
    if (a.kind === 'text') fullText += `\n\n--- 附件 ${a.name} ---\n\`\`\`\n${a.data.slice(0, 20000)}\n\`\`\``;
    else images.push(a.data);
  });
  if (images.length === 0) return { content: fullText, images };
  const content = [{ type: 'text', text: fullText }];
  images.forEach(src => content.push({ type: 'image_url', image_url: { url: src } }));
  return { content, images };
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text && attachments.length === 0) return;
  input.value = '';
  const { content, images } = buildUserContent(text || '请分析这张图片/这份文件');
  attachments = []; renderChips();
  appendUserMsg(typeof content === 'string' ? content : text, images);
  chatHistory.push({ role: 'user', content });

  const el = document.getElementById('chat-messages');
  const bot = document.createElement('div');
  bot.className = 'msg bot';
  const searchDet = makeDetails('search', '搜索中...', true);
  const thinkDet = makeDetails('thinking', '思考过程', true);
  const thinkBody = document.createElement('div');
  thinkDet.appendChild(thinkBody);
  const contentDiv = document.createElement('div');
  contentDiv.textContent = '思考中...';
  const metricsDiv = document.createElement('div');
  metricsDiv.className = 'metrics';
  const wantSearch = document.getElementById('web-search').checked;
  if (wantSearch) bot.appendChild(searchDet);
  bot.appendChild(thinkDet);
  bot.appendChild(contentDiv);
  bot.appendChild(metricsDiv);
  el.appendChild(bot);
  el.scrollTop = el.scrollHeight;

  const selectedModel = document.getElementById('chat-model').value || undefined;
  const t0 = performance.now();
  let ttft = null, accText = '', accReason = '', usage = null, searchResults = [];
  let hasContent = false;

  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: chatHistory.map(m => ({ role: m.role, content: m.content })),
        web_search: wantSearch,
        model: selectedModel,
      }),
    });
    if (!resp.ok) {
      let detail = resp.statusText;
      try { detail = (await resp.json()).detail || detail; } catch {}
      throw new Error(detail);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        let j;
        try { j = JSON.parse(payload); } catch { continue; }
        if (j.error) throw new Error(j.error);
        if (j.search_results) {
          searchResults = j.search_results;
          fillSearchBlock(searchDet, searchResults);
          continue;
        }
        if (j.usage) { usage = j.usage; continue; }
        const delta = (j.choices && j.choices[0] && j.choices[0].delta) || {};
        const rc = delta.reasoning || delta.reasoning_content;
        if (rc) {
          accReason += rc;
          thinkBody.textContent = accReason;
          el.scrollTop = el.scrollHeight;
        }
        if (delta.content) {
          if (ttft === null) ttft = (performance.now() - t0) / 1000;
          if (!hasContent) { contentDiv.textContent = ''; hasContent = true; }
          accText += delta.content;
          contentDiv.innerHTML = '';
          contentDiv.appendChild(renderMd(accText, false));
          el.scrollTop = el.scrollHeight;
        }
      }
    }
    const total = (performance.now() - t0) / 1000;
    const tokens = usage ? usage.completion_tokens : 0;
    const genTime = ttft !== null ? total - ttft : total;
    const metrics = {
      ttft: ttft !== null ? ttft.toFixed(2) : null,
      tps: tokens > 0 && genTime > 0.01 ? (tokens / genTime).toFixed(1) : null,
      tokens, total: total.toFixed(1), model: selectedModel || '',
    };
    metricsDiv.textContent = metricsText(metrics);
    searchDet.open = false;
    thinkDet.open = false;
    if (!hasContent) contentDiv.textContent = accText || '(空回复)';
    else { contentDiv.innerHTML = ''; contentDiv.appendChild(renderMd(accText, true)); }
    addMsgCopyAction(bot, accText);
    const msg = { role: 'assistant', content: accText };
    if (accReason) msg.reasoning = accReason;
    if (searchResults.length) msg.search_results = searchResults;
    msg.metrics = metrics;
    chatHistory.push(msg);
    saveChat();
  } catch (e) {
    if (!hasContent) contentDiv.textContent = '请求失败: ' + e.message;
    thinkDet.open = false;
    searchDet.open = false;
    chatHistory.pop();
  }
}

// ---- 对话持久化 ----
async function saveChat() {
  try {
    const data = await api('/api/chats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: currentChatId, messages: chatHistory }),
    });
    currentChatId = data.id;
    refreshChatList();
  } catch (e) { console.error('保存对话失败', e); }
}

async function refreshChatList(selectId) {
  const sel = document.getElementById('chat-list');
  try {
    const data = await api('/api/chats');
    sel.innerHTML = '<option value="">当前对话</option>' + data.chats.map(c =>
      `<option value="${c.id}" ${c.id === (selectId || currentChatId) ? 'selected' : ''}>${c.title}</option>`
    ).join('');
  } catch (e) {}
}

async function loadChat(id) {
  if (!id) return;
  try {
    const data = await api(`/api/chats/${id}`);
    currentChatId = data.id;
    chatHistory = data.messages || [];
    document.getElementById('chat-messages').innerHTML = '';
    chatHistory.forEach(m => {
      if (m.role === 'user') {
        const imgs = Array.isArray(m.content)
          ? m.content.filter(p => p.type === 'image_url').map(p => p.image_url.url) : [];
        const txt = Array.isArray(m.content)
          ? m.content.filter(p => p.type === 'text').map(p => p.text).join(' ') : m.content;
        appendUserMsg(txt, imgs);
      } else if (m.role === 'assistant') {
        appendBotMsg(m.content, m.reasoning, m.search_results || [], m.metrics);
      }
    });
  } catch (e) { toast('加载对话失败: ' + e.message, true); }
}

function newChat() {
  currentChatId = null;
  chatHistory = [];
  document.getElementById('chat-messages').innerHTML = '';
  document.getElementById('chat-list').value = '';
}

refreshChatList();
</script>

<script>
let models = [];
let logTimer = null;
let currentLogKey = null;

function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (isError ? 'error' : 'info');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast', 4000);
}

async function api(path, opts) {
  const resp = await fetch(path, opts);
  if (!resp.ok) {
    let detail = resp.statusText;
    try { detail = (await resp.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return resp.json();
}

async function refreshModels() {
  try {
    const data = await api('/api/models');
    models = data.models;
    render();
    if (window.refreshChatModels) refreshChatModels();
  } catch (e) { /* docker 暂时不可用时静默 */ }
}

async function refreshGpu() {
  try {
    const g = await api('/api/gpu');
    document.getElementById('gpu-name').textContent = 'GPU: ' + g.name;
    document.getElementById('gpu-util').textContent = g.utilization;
    document.getElementById('gpu-mem').textContent =
      (g.memory_used / 1024).toFixed(1) + ' / ' + (g.memory_total / 1024).toFixed(0) + ' GB';
    document.getElementById('gpu-mem-fill').style.width = (g.memory_used / g.memory_total * 100) + '%';
    document.getElementById('gpu-temp').textContent = g.temperature;
    document.getElementById('gpu-power').textContent = g.power.toFixed(0);
  } catch (e) {}
}

function statusBadge(m) {
  if (m.api_ready) return '<span class="badge green">API 就绪</span>';
  if (m.running) return '<span class="badge yellow">启动中</span>';
  if (m.downloading) return '<span class="badge yellow">下载中</span>';
  if (m.downloaded) return '<span class="badge gray">已下载 · 未运行</span>';
  return '<span class="badge gray">未下载</span>';
}

function render() {
  const el = document.getElementById('models');
  el.innerHTML = models.map(m => `
    <div class="card ${m.running ? 'running' : ''}">
      <h2>${m.key} ${statusBadge(m)}</h2>
      <div class="model-id">${m.model_id || '(未配置模型路径)'}</div>
      <div class="actions">
        ${m.running
          ? `<button class="danger" onclick="stopModel('${m.key}')">停止</button>`
          : `<button class="primary" onclick="startModel('${m.key}')" ${m.downloaded ? '' : 'disabled title="先下载权重"'}>启动</button>`}
        ${!m.downloaded && !m.running
          ? (m.downloading
            ? `<button onclick="showDownloadLog('${m.key}')">下载进度</button>`
            : `<button onclick="downloadModel('${m.key}')">下载</button>`)
          : ''}
        <button onclick="showLogs('${m.key}')" ${m.running ? '' : 'disabled'}>日志</button>
        ${m.api_ready ? `<button onclick="testApi()">冒烟测试</button>` : ''}
      </div>
    </div>
  `).join('');
}

async function downloadModel(key) {
  toast(`开始下载 ${key}，权重在后台下载到 models/ 目录`);
  try {
    await api(`/api/models/${key}/download`, { method: 'POST' });
    showDownloadLog(key);
  } catch (e) { toast('下载启动失败: ' + e.message, true); }
  refreshModels();
}

function showDownloadLog(key) {
  document.getElementById('log-title').textContent = `下载进度: ${key}`;
  document.getElementById('log-panel').classList.add('open');
  clearInterval(logTimer);
  const tick = async () => {
    try {
      const data = await api(`/api/models/${key}/download-status`);
      const el = document.getElementById('log-content');
      el.textContent = data.log || '(等待输出...)';
      el.scrollTop = el.scrollHeight;
      if (data.status === 'done') {
        toast('下载完成');
        clearInterval(logTimer);
        refreshModels();
      } else if (data.status === 'failed') {
        toast('下载失败，见日志', true);
        clearInterval(logTimer);
      }
    } catch (e) {}
  };
  tick();
  logTimer = setInterval(tick, 3000);
}

async function startModel(key) {
  toast(`正在启动 ${key}，首次需拉取镜像/加载权重，请耐心等日志...`);
  try {
    await api(`/api/models/${key}/start`, { method: 'POST' });
    toast(`${key} 容器已启动，等待 vLLM 加载完成`);
    showLogs(key);
  } catch (e) { toast('启动失败: ' + e.message, true); }
  refreshModels();
}

async function stopModel(key) {
  try {
    await api(`/api/models/${key}/stop`, { method: 'POST' });
    toast(`${key} 已停止`);
    if (currentLogKey === key) closeLogs();
  } catch (e) { toast('停止失败: ' + e.message, true); }
  refreshModels();
}

function showLogs(key) {
  currentLogKey = key;
  document.getElementById('log-title').textContent = `日志: ${key}`;
  document.getElementById('log-panel').classList.add('open');
  const tick = async () => {
    if (currentLogKey !== key) return;
    try {
      const data = await api(`/api/models/${key}/logs?tail=100`);
      const el = document.getElementById('log-content');
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 50;
      el.textContent = data.logs;
      if (atBottom) el.scrollTop = el.scrollHeight;
    } catch (e) {}
  };
  tick();
  clearInterval(logTimer);
  logTimer = setInterval(tick, 3000);
}

function closeLogs() {
  currentLogKey = null;
  clearInterval(logTimer);
  document.getElementById('log-panel').classList.remove('open');
}

async function testApi() {
  toast('运行冒烟测试（对话 + 工具调用）...');
  try {
    const data = await api('/api/test', { method: 'POST' });
    if (data.ok) toast('冒烟测试通过');
    else toast('冒烟测试失败: ' + data.output.slice(-300), true);
  } catch (e) { toast('测试失败: ' + e.message, true); }
}

refreshModels();
refreshGpu();
setInterval(refreshModels, 5000);
setInterval(refreshGpu, 3000);
</script>
</body>
